name: SoWork Keep Alive

on:
  schedule:
    # ⚠️ SoWork CHỈ cho 1 kết nối/tài khoản — 2 phiên chạy song song sẽ ĐÁ nhau (rớt liên tục).
    # => Các ca chạy KHÔNG gối đầu. Mỗi ca ~5h20m, tự thoát ~10 phút TRƯỚC khi ca sau bắt đầu.
    # Dùng PHÚT LẺ (không phải :00) để tránh giờ cao điểm của GitHub -> đỡ bị trễ/bỏ lượt.
    #   00:35 UTC = 07:35 VN   (07:35 -> ~12:55 VN)
    #   06:05 UTC = 13:05 VN   (13:05 -> ~18:25 VN)
    #   11:35 UTC = 18:35 VN   (18:35 -> tự dừng lúc 23:00 VN)
    # Thứ 2 đến Thứ 6. (Có khoảng hở ~10 phút giữa các ca để tránh 2 phiên đè nhau.)
    - cron: '35 0 * * 1-5'
    - cron: '5 6 * * 1-5'
    - cron: '35 11 * * 1-5'
  workflow_dispatch: # Cho phép bấm chạy thủ công

# Chặn 2 lần chạy chồng nhau (nếu 1 job trễ giờ, hủy job cũ trước khi chạy cái mới)
concurrency:
  group: sowork-keepalive
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    # Image chính thức của Playwright: đã cài sẵn Node 20 + Chromium + thư viện hệ thống
    # -> KHÔNG cần setup-node, KHÔNG cần tải Chromium mỗi lần (nhanh hơn hẳn).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    timeout-minutes: 325  # ~5h25m; keepalive.js tự thoát trước bằng RUN_MINUTES

    steps:
    - name: Kiểm tra mã nguồn
      uses: actions/checkout@v4

    - name: Cài gói playwright (JS) — browser đã có sẵn trong image
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'  # dùng Chromium có sẵn, không tải lại
      run: npm install playwright@1.62.1 --no-save

    - name: Giữ trạng thái Online
      env:
        SOWORK_SESSION: ${{ secrets.SOWORK_SESSION }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # có thì keepalive tự báo Slack mọi sự kiện
        SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}           # member ID (U...) để tag bạn trong tin nhắn
        RUN_MINUTES: '320'   # 5h20m -> ca kết thúc ~10 phút trước ca kế, không đè nhau
        STOP_HOUR_VN: '23'
      run: node keepalive.js

    - name: Lưu ảnh chụp lỗi (nếu có)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: keepalive-error
        path: keepalive-error.png
        if-no-files-found: ignore

    - name: Báo Slack khi job lỗi/bị hủy
      if: failure()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
      run: |
        if [ -n "$SLACK_WEBHOOK_URL" ]; then
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          MENTION=""
          if [ -n "$SLACK_USER_ID" ]; then MENTION="<@$SLACK_USER_ID> "; fi
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"${MENTION}❌ *SoWork Keep Alive* job THẤT BẠI. Xem log: $RUN_URL\",\"link_names\":1}" \
            "$SLACK_WEBHOOK_URL" || true
        fi
