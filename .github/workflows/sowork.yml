name: SoWork Keep Alive

on:
  schedule:
    # Chạy mỗi 10 phút, từ 1:00 AM đến 4:59 PM giờ UTC (tương đương 8:00 AM đến 11:59 PM giờ VN)
    # Áp dụng từ Thứ 2 đến Thứ 6 (1-5)
    - cron: '*/10 1-16 * * 1-5'
  workflow_dispatch: # Cho phép bấm chạy thủ công nếu muốn

jobs:
  ping-sowork:
    runs-on: ubuntu-latest

    steps:
    - name: Kiểm tra mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cài đặt thư viện Playwright
      run: |
        npm init -y
        npm install playwright
        npx playwright install chromium --with-deps

    - name: Chạy mã giữ trạng thái Online
      env:
        SOWORK_COOKIES: ${{ secrets.SOWORK_COOKIES }}
      run: node keepalive.js
