name: SoWork Stats

on:
  schedule:
    # 16:00 UTC = 23:00 giờ VN — chốt cuối ngày làm việc, T2–T6.
    - cron: '0 16 * * 1-5'
  workflow_dispatch:  # Bấm chạy tay bất cứ lúc nào (có thể mở github.com trên điện thoại để bấm)
    inputs:
      startDate:
        description: 'Ngày bắt đầu (YYYY-MM-DD). Bỏ trống = hôm nay (giờ VN).'
        required: false
        default: ''
      endDate:
        description: 'Ngày kết thúc (YYYY-MM-DD). Bỏ trống = bằng ngày bắt đầu.'
        required: false
        default: ''

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
    - name: Kiểm tra mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Lấy báo cáo hoạt động SoWork
      env:
        SOWORK_SESSION: ${{ secrets.SOWORK_SESSION }}
        # SOWORK_GROUP_ID: ${{ secrets.SOWORK_GROUP_ID }}   # mở nếu cần đổi văn phòng
      run: node stats.js "${{ github.event.inputs.startDate }}" "${{ github.event.inputs.endDate }}"
